# Política de disputas · fuente única de umbrales (docs/design.md, sección 3)
# Cambiar cualquier valor sube policy_version. Datos calibrados en Fase 2;
# el umbral de intención sigue a cargo de B (Fase 4).

policy_version: "1.1.0"

# "Hoy" para ventanas y SLA. Última process_date en transactions_12m (2026-06-17).
reference_date: "2026-06-17"

currencies: [ARS, COP, USD]   # no hay MXN: los clientes de México operan en USD

intent:
  tau_intencion: 0.60          # B calibra en val (precisión ≥ 95 %)
  max_clarifications: 2

search:
  lookback_days: 120
  max_results: 5
  amount_tolerance_pct: 2.0

rules:
  claim_window_days: 60        # Política sintética; el dataset no identifica una ventana legal/operativa.
  # Calibración jul-2025..mar-2026; prueba abr-2026..17-jun-2026. analysis/02_politica.ipynb
  # ≥40: calibración precisión 483/483, recall 483/1006; prueba 143/143, recall 143/296.
  # Se conserva la banda conservadora acordada; alternativa empírica ≥31 documentada, no aplicada.
  fraud_score_high: 40
  # ≥30 (incluye altos): calibración precisión 557/701, recall 557/1006;
  # prueba precisión 165/215, recall 165/296. Nulos incluidos en denominador de recall.
  fraud_score_low: 30
  amount_usd_max:              # p95 SOLO calibración, tras completar USD y FX diario; redondeado a centavos.
    Purchase: 475.53
    Withdrawal: 475.90
    Payment: 1904.15
    Adjustment: 950.58
    Transfer: 9501.20
    Deposit: 4753.11
    default: 1000
  repeat_disputes_k: 3         # τ_k (R11)
  repeat_window_days: 90

# En complaints el SLA incumplido no depende de la prioridad ni de resolution_days
# (uniforme ~20 %), así que no se puede derivar: son valores de política sintética.
sla_days_by_priority:
  critical: 1
  high: 3
  medium: 10
  low: 15

confirmation:
  ttl_seconds: 300
